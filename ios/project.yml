# xcodegen spec for the Squelch iPhone remote. The phone's code lives in the SquelchKit package
# (swift test on a Mac); this project wraps the app, its Controls extension and its Apple Watch app around it
# so it can archive and ship to TestFlight. Regenerate with: cd ios && xcodegen
#
# App Store Connect record: "Squelch Remote" (bundle io.forit.squelch). The home
# screen name stays "Squelch" (CFBundleDisplayName in App/Info.plist).
name: Squelch
options:
  bundleIdPrefix: io.forit
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true
packages:
  SquelchKit:
    path: SquelchKit
targets:
  Squelch:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: App
      # The App Intents the app and the Controls extension both run.
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.forit.squelch
        PRODUCT_NAME: Squelch
        MARKETING_VERSION: "1.0"
        # Local default only. CI sets it from the run number, so every upload has a higher one.
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # visionOS takes a layered icon (for-iCommon docs/visionos.md, step 4).
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=xr*]": AppIcon-Vision
        # No AccentColor asset: the tint is ForIT's, from .forITTint() on the root (for-iCommon checklist BR-1).
        # iPhone, iPad, and Apple Vision Pro natively.
        # No "Designed for iPhone" compatibility mode.
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator xros xrsimulator"
        TARGETED_DEVICE_FAMILY: "1,2,7"
        # visionOS 26, the ForIT floor (for-iCommon checklist PL-1). The Vision 1.0 in App Review was built for 2.0.
        XROS_DEPLOYMENT_TARGET: "26.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: UUSSWWML2A
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Squelch App Store"
        CODE_SIGN_ENTITLEMENTS: App/Squelch.entitlements
    dependencies:
      - package: SquelchKit
        product: SquelchRemote
      - package: SquelchKit
        product: SquelchWatchLink
      # Control Center, Lock Screen and Action button controls (PlugIns/SquelchControls.appex). iPhone only:
      # visionOS has no Control Center controls, so its build leaves the extension out.
      - target: SquelchControls
        embed: true
        destinationFilters: [iOS]
      # The Apple Watch app, in Watch/, so it installs on the paired Watch with the app. Not on Apple Vision.
      - target: SquelchWatch
        destinationFilters: [iOS]

  # The controls: Mute and Camera buttons for Control Center, the Lock Screen and the Action button.
  # Its own bundle id and App Store profile ("Squelch Controls App Store").
  # It reads the pairing through the shared
  # keychain group, and Local Network access is the app's (TN3179).
  SquelchControls:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Controls
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.forit.squelch.controls
        PRODUCT_NAME: SquelchControls
        # Must equal the app's: App Store Connect refuses an extension whose version differs.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Controls/Info.plist
        # Control Center on iPad too.
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: UUSSWWML2A
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Squelch Controls App Store"
        CODE_SIGN_ENTITLEMENTS: Controls/SquelchControls.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    dependencies:
      - package: SquelchKit
        product: SquelchRemote

  # The Apple Watch app: mute from the wrist. It asks the iPhone over WatchConnectivity and the phone presses
  # (Watch/PhoneLink.swift, App/WatchRelay.swift), so it has no pairing, keychain or network of its own and no
  # entitlements. Its own bundle id and App Store profile ("Squelch Watch App Store").
  # The icon is its own copy of the phone's (Watch/Assets.xcassets).
  SquelchWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: Watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.forit.squelch.watchkitapp
        PRODUCT_NAME: SquelchWatch
        # Must equal the app's; CI passes CURRENT_PROJECT_VERSION to every target.
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: Watch/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: UUSSWWML2A
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # Archived inside the iPhone app, not on its own.
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        PROVISIONING_PROFILE_SPECIFIER: "Squelch Watch App Store"
    dependencies:
      - package: SquelchKit
        product: SquelchWatchLink

schemes:
  Squelch:
    build:
      targets:
        Squelch: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
